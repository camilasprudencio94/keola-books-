<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#18251f"
  >

  <meta
    name="description"
    content="Keola Books — catálogo inteligente de livros."
  >

  <title>Keola Books</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header>

    <div class="container">

      <div class="brand">

        <div class="logo">
          K
        </div>

        <div>

          <div class="kicker">
            KEOLA
          </div>

          <h1>
            Keola Books
          </h1>

          <p class="subtitle">
            Encontre o livro certo para cada pessoa.
          </p>

        </div>

      </div>

    </div>

  </header>


  <!-- =========================
       ÁREA DE BUSCA
  ========================== -->

  <section class="hero">

    <div class="container">

      <div class="hero-box">

        <h2>
          O que você está procurando?
        </h2>

        <p>
          Busque por título, autor, tema,
          necessidade, perfil ou palavras-chave.
        </p>


        <!-- BUSCA -->

        <div class="search">

          <input
            id="search"
            type="search"
            placeholder="Ex.: casamento, rejeição, pais, liderança..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          >

          <button
            type="button"
            class="btn light"
            id="searchBtn"
          >
            Buscar
          </button>

        </div>


        <!-- BUSCAS RÁPIDAS -->

        <div class="quick">

          <button
            type="button"
            class="chip"
            data-q="casamento"
          >
            Casamento
          </button>


          <button
            type="button"
            class="chip"
            data-q="pais"
          >
            Pais
          </button>


          <button
            type="button"
            class="chip"
            data-q="cura emocional"
          >
            Cura emocional
          </button>


          <button
            type="button"
            class="chip"
            data-q="liderança"
          >
            Liderança
          </button>


          <button
            type="button"
            class="chip"
            data-q="mulheres"
          >
            Mulheres
          </button>

        </div>

      </div>

    </div>

  </section>



  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main class="container">


    <!-- FILTROS -->

    <section class="controls">


      <!-- CATEGORIA -->

      <select
        id="categoria"
        aria-label="Filtrar por categoria"
      >

        <option value="">
          Todas as categorias
        </option>

      </select>


      <!-- TEMA -->

      <select
        id="tema"
        aria-label="Filtrar por tema"
      >

        <option value="">
          Todos os temas
        </option>

      </select>


      <!-- AUTOR -->

      <select
        id="autor"
        aria-label="Filtrar por autor"
      >

        <option value="">
          Todos os autores
        </option>

      </select>


      <!-- EDITORA -->

      <select
        id="editora"
        aria-label="Filtrar por editora"
      >

        <option value="">
          Todas as editoras
        </option>

      </select>


    </section>



    <!-- =========================
         STATUS DA BUSCA
    ========================== -->

    <div class="status">

      <span id="count">
        Carregando catálogo...
      </span>


      <button
        type="button"
        class="btn secondary"
        id="clearBtn"
      >
        Limpar
      </button>

    </div>



    <!-- =========================
         RESULTADOS
    ========================== -->

    <section
      id="results"
      class="grid"
      aria-live="polite"
    >

    </section>



    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

      Keola Books · catálogo de consulta

    </footer>


  </main>



  <!-- =========================
       JANELA DE DETALHES
  ========================== -->

  <dialog id="modal">

    <div class="modal">


      <button
        type="button"
        class="close"
        id="closeModal"
        aria-label="Fechar"
      >
        ×
      </button>


      <div id="modalContent">

      </div>


    </div>

  </dialog>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js?v=3"></script>


</body>

</html>
