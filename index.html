
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18251f">
  <title>Keola Books — Catálogo</title>
  <meta name="description" content="Catálogo de livros Keola Books.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <div class="logo">K</div>
        <div>
          <div class="kicker">Keola</div>
          <h1>Keola Books</h1>
          <p class="subtitle">Encontre o livro certo para cada pessoa.</p>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-box">
        <h2>O que essa pessoa está vivendo?</h2>
        <p>Busque por título, autor, tema, necessidade, perfil ou palavras-chave.</p>

        <div class="search">
          <input
            id="search"
            type="search"
            placeholder="Ex.: casamento, rejeição, pais, liderança..."
            autocomplete="off"
          >
          <button class="btn light" id="searchBtn">Buscar</button>
        </div>

        <div class="quick">
          <button class="chip" data-q="casamento">Casamento</button>
          <button class="chip" data-q="pais">Pais</button>
          <button class="chip" data-q="cura">Cura emocional</button>
          <button class="chip" data-q="liderança">Liderança</button>
          <button class="chip" data-q="mulheres">Mulheres</button>
        </div>
      </div>
    </div>
  </section>

  <main class="container">
    <section class="controls">
      <select id="categoria">
        <option value="">Todas as categorias</option>
      </select>

      <select id="tema">
        <option value="">Todos os temas</option>
      </select>

      <select id="autor">
        <option value="">Todos os autores</option>
      </select>

      <select id="editora">
        <option value="">Todas as editoras</option>
      </select>
    </section>

    <div class="status">
      <span id="count">Carregando catálogo...</span>
      <button class="btn secondary" id="clearBtn">Limpar filtros</button>
    </div>

    <section id="results" class="grid"></section>

    <footer>Keola Books · catálogo de consulta</footer>
  </main>

  <dialog id="modal">
    <div class="modal">
      <button class="close" id="closeModal" aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
